name: SleepTracker
options:
  deploymentTarget:
    iOS: '17.0'
targets:
  SleepTracker:
    type: application
    platform: iOS
    sources:
      - path: SleepTracker
        excludes: [Info.plist]
    info:
      path: SleepTracker/Info.plist
      properties:
        CFBundleDisplayName: Sleep tracker
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Sleep tracker records audio during sessions you start and analyzes it on this iPhone to detect nighttime sounds such as snoring, talking, and coughing.
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vesco.sleeptracker
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
